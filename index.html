<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Heat Calculator - Starship</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --panel-bg: #111827;
            --accent-orange: #ff5722;
            --accent-blue: #00bcd4;
            --accent-green: #4caf50;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-banner {
            background: linear-gradient(135deg, #ff5722 0%, #3f51b5 100%);
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 15px 0;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
            margin-bottom: 15px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .radio-tile-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .radio-tile {
            flex: 1;
            background-color: #070a13;
            border: 1px solid var(--border-color);
            padding: 10px 5px;
            text-align: center;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .radio-tile.active {
            border-color: var(--accent-blue);
            background-color: rgba(0, 188, 212, 0.15);
            color: white;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            background-color: #070a13;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .drop-zone {
            border: 2px dashed #2563eb;
            border-radius: 8px;
            padding: 30px 15px;
            text-align: center;
            background-color: #0f172a;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .drop-zone.highlight {
            background-color: #1e3a8a;
            border-color: #60a5fa;
        }

        .drop-zone p {
            margin: 10px 0 0 0;
            font-size: 0.9rem;
            color: var(--accent-blue);
        }

        .drop-zone span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-calc {
            width: 100%;
            background: linear-gradient(90deg, #f97316 0%, #ea580c 100%);
            border: none;
            color: white;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3);
        }

        .results-panel {
            margin-top: 25px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: #070a13;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }

        .stat-box .title {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .stat-box .value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            margin-bottom: 20px;
            background-color: #070a13;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="header-banner">🔥 Telemetry Heat Calculator</div>

    <div class="main-container">
        <h2>📡 ข้อมูล TELEMETRY</h2>

        <div class="input-group">
            <input type="text" id="missionName" value="STARSHIP" style="font-weight: bold; font-size: 1.1rem;">
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;"><button style="width: 100%; padding: 8px; background: #1f2937; color: #10b981; border: 1px solid var(--border-color); border-radius: 6px;">💾 สำรอง (Export)</button></div>
            <div style="flex: 1;"><button style="width: 100%; padding: 8px; background: #1f2937; color: #fbbf24; border: 1px solid var(--border-color); border-radius: 6px;">📁 นำเข้า (Import)</button></div>
        </div>
        <br>

        <label style="font-size: 0.85rem; color: var(--text-muted);">หน่วยความสูงในไฟล์</label>
        <div class="radio-tile-group" id="altitudeUnitGroup">
            <div class="radio-tile active" data-value="m">ม.</div>
            <div class="radio-tile" data-value="km">กม.</div>
            <div class="radio-tile" data-value="ft">ฟุต</div>
        </div>

        <label style="font-size: 0.85rem; color: var(--text-muted);">หน่วยความเร็วในไฟล์</label>
        <div class="radio-tile-group" id="speedUnitGroup">
            <div class="radio-tile active" data-value="ms">ม/วิ</div>
            <div class="radio-tile" data-value="kmh">กม/ชม</div>
            <div class="radio-tile" data-value="mach">มัค</div>
        </div>

        <div class="drop-zone" id="dropZone">
            <div style="font-size: 2rem;">📊</div>
            <p id="dropZoneText">กดเลือกไฟล์หรือลากไฟล์มาวางที่นี่</p>
            <span>รองรับไฟล์ตาราง .csv และ .xlsx (Excel)</span>
            <input type="file" id="fileInput" accept=".csv,.txt,.xlsx" style="display: none;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
                <label>รัศมีจมูก Rₙ (ม.)</label>
                <input type="number" id="radius" value="4.5" step="0.1">
            </div>
            <div class="input-group">
                <label>Emissivity ε</label>
                <input type="number" id="emissivity" value="0.85" step="0.01">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
                <label>ละติจูด (Latitude)</label>
                <input type="text" id="lat" value="-27.402711">
            </div>
            <div class="input-group">
                <label>ลองจิจูด (Longitude)</label>
                <input type="text" id="lon" value="65.61889">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
                <label>วันที่ (UTC Date)</label>
                <input type="text" id="utcDate" value="13/10/2024">
            </div>
            <div class="input-group">
                <label>เวลาชั่วโมง (UTC Hour)</label>
                <input type="number" id="utcHour" value="13">
            </div>
        </div>

        <div class="input-group">
            <label>📝 บันทึกภารกิจ</label>
            <textarea id="notes" rows="3" placeholder="บันทึกสภาพการบิน..."></textarea>
        </div>

        <button class="btn-calc" id="btnCalculate">🔥 คำนวณความร้อนทุกจุด</button>

        <div class="results-panel" id="resultsPanel">
            <h2>🌡️ ผลการคำนวณ</h2>
            <div class="stats-grid">
                <div class="stat-box"><div class="title">🌡️ T_W สูงสุด</div><div class="value" id="maxTw" style="color: var(--accent-orange);">0 °C</div></div>
                <div class="stat-box"><div class="title">💥 Q̇ รวมสูงสุด</div><div class="value" id="maxQ" style="color: #facc15;">0 MW/ม²</div></div>
                <div class="stat-box"><div class="title">🚀 MACH สูงสุด</div><div class="value" id="maxMach" style="color: var(--accent-blue);">M 0.00</div></div>
                <div class="stat-box"><div class="title">🌡️ T_W เฉลี่ย</div><div class="value" id="avgTw" style="color: var(--accent-green);">0 °C</div></div>
            </div>
            <div class="chart-container"><canvas id="twChart"></canvas></div>
            <div class="chart-container"><canvas id="qChart"></canvas></div>
        </div>
    </div>

    <script>
        // --- 1. ตั้งค่า Elements และ Global State ---
        const dropZone = document.getElementById('dropZone');
        const dropZoneText = document.getElementById('dropZoneText');
        const fileInput = document.getElementById('fileInput');
        const btnCalculate = document.getElementById('btnCalculate');
        const resultsPanel = document.getElementById('resultsPanel');
        
        let parsedTelemetryData = []; // เก็บข้อมูล Global ป้องกันค่าหายสลับหน้าจอ
        let twChartInstance = null;
        let qChartInstance = null;

        // --- 2. ระบบปุ่มเลือกหน่วยความสูง/ความเร็ว (แก้บั๊กกดไม่ได้) ---
        function setupRadioGroup(groupId) {
            const group = document.getElementById(groupId);
            const tiles = group.querySelectorAll('.radio-tile');
            tiles.forEach(tile => {
                tile.addEventListener('click', function() {
                    tiles.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }
        setupRadioGroup('altitudeUnitGroup');
        setupRadioGroup('speedUnitGroup');

        function getActiveUnit(groupId) {
            const activeTile = document.getElementById(groupId).querySelector('.radio-tile.active');
            return activeTile ? activeTile.getAttribute('data-value') : '';
        }

        // --- 3. ระบบจัดการลากวางไฟล์และเลือกไฟล์ ---
        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0) processFile(files[0]);
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        });

        function processFile(file) {
            dropZoneText.innerText = `เลือกไฟล์สำเร็จ: ${file.name}`;
            dropZoneText.style.color = '#10b981';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // อัปเดตข้อมูลเข้าตัวแปรตัวกลางทันทีหลังอ่านเสร็จ
                parsedTelemetryData = parseAndFixTelemetry(e.target.result);
            };
            reader.readAsText(file);
        }

        // --- 4. ตัวคัดกรองข้อมูลประมวลผล (Parser) ดักจับฟอร์แมตใหม่และ KMIH ---
        function parseAndFixTelemetry(text) {
            const lines = text.split('\n');
            const dataResult = [];
            const flexibleRegex = /(\d+)\s+KM[\/I]H\s+(\d+)\s+KM/i;

            lines.forEach(line => {
                let currentLine = line.trim();
                if (!currentLine) return;

                let speedVal = 0;
                let altVal = 0;

                if (currentLine.includes('SPEED') && currentLine.includes('ALTITUDE')) {
                    const speedMatch = currentLine.match(/SPEED\s+(\d+)/i);
                    const altMatch = currentLine.match(/ALTITUDE\s+(\d+)/i);
                    if (speedMatch && altMatch) {
                        speedVal = parseInt(speedMatch[1], 10);
                        altVal = parseInt(altMatch[1], 10); // อิงโครงสร้างอ่านค่าดั้งเดิมของคุณ
                    }
                } else {
                    const match = currentLine.match(flexibleRegex);
                    if (match) {
                        speedVal = parseInt(match[1], 10);
                        altVal = parseInt(match[2], 10);
                    }
                }

                if (speedVal > 0 || altVal > 0) {
                    dataResult.push({ rawSpeed: speedVal, rawAltitude: altVal });
                }
            });
            return dataResult;
        }

        // --- 5. สภาวะบรรยากาศอิงข้อมูลตารางประวัติ NRLMSISE-00 ---
        function getNrlmsiseDensity(altKm, lat, lon) {
            const alt = parseFloat(altKm);
            if (alt > 80) return 1.8e-8;
            if (alt > 60) return 3.0e-7;
            if (alt > 40) return 4.0e-6;
            if (alt > 30) return 1.7e-5;
            if (alt > 20) return 8.8e-5;
            if (alt > 15) return 1.9e-4;
            if (alt > 11) return 3.6e-4;
            return 1.225 * Math.exp(-alt / 7.5);
        }

        // --- 6. ปุ่มคํานวณประมวลผลฟิสิกส์ความร้อน ---
        btnCalculate.addEventListener('click', () => {
            // ดักแก้วิ่งชนปัญหาล้างค่า ตัวแปรอาศัยตรวจสอบความยาวอาร์เรย์ตัวกลาง
            if (!parsedTelemetryData || parsedTelemetryData.length === 0) {
                alert("กรุณาเลือกไฟล์ก่อนครับ");
                return;
            }

            const Rn = parseFloat(document.getElementById('radius').value) || 4.5;
            const epsilon = parseFloat(document.getElementById('emissivity').value) || 0.85;
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const sigma = 5.67e-8;

            const altUnit = getActiveUnit('altitudeUnitGroup');
            const speedUnit = getActiveUnit('speedUnitGroup');

            let maxTw = 0, maxQ = 0, maxMach = 0, sumTw = 0;
            const labels = [], twData = [], qData = [], machData = [];

            parsedTelemetryData.forEach(data => {
                // แปลงหน่วยความสูงเข้าสู่แกนมาตรฐานกิโลเมตร
                let altKm = data.rawAltitude;
                if (altUnit === 'm') altKm = data.rawAltitude / 1000;
                if (altUnit === 'ft') altKm = data.rawAltitude * 0.0003048;

                // แปลงหน่วยความเร็วเข้าสู่เมตรต่อวินาที (m/s)
                let vMs = data.rawSpeed;
                if (speedUnit === 'kmh') vMs = (data.rawSpeed * 1000) / 3600;
                if (speedUnit === 'mach') vMs = data.rawSpeed * 295.0;

                const mach = vMs / 295.0; // ดึงอ้างอิงความเร็วเสียงดั้งเดิม

                // ประมวลผลร่วมกับค่าสภาพบรรยากาศจริง
                const rho = getNrlmsiseDensity(altKm, lat, lon);
                
                let q_dot = 1.103e-4 * Math.sqrt(rho / Rn) * Math.pow(vMs, 3);
                q_dot = q_dot / 1000000; 

                const tw_kelvin = Math.pow((q_dot * 1000000) / (epsilon * sigma), 0.25);
                const tw_celsius = Math.floor(tw_kelvin - 273.15);

                if (tw_celsius > maxTw) maxTw = tw_celsius;
                if (q_dot > maxQ) maxQ = q_dot;
                if (mach > maxMach) maxMach = mach;
                sumTw += tw_celsius;

                labels.push(altKm.toFixed(1));
                twData.push(tw_celsius);
                qData.push(q_dot.toFixed(4));
                machData.push(mach.toFixed(2));
            });

            document.getElementById('maxTw').innerText = `${maxTw} °C`;
            document.getElementById('maxQ').innerText = `${maxQ.toFixed(4)} MW/ม²`;
            document.getElementById('maxMach').innerText = `M ${maxMach.toFixed(2)}`;
            document.getElementById('avgTw').innerText = `${Math.floor(sumTw / parsedTelemetryData.length)} °C`;

            resultsPanel.style.display = 'block';
            renderCharts(labels, twData, qData, machData);
        });

        function renderCharts(labels, twData, qData, machData) {
            const ctxTw = document.getElementById('twChart').getContext('2d');
            const ctxQ = document.getElementById('qChart').getContext('2d');
            if (twChartInstance) twChartInstance.destroy();
            if (qChartInstance) qChartInstance.destroy();

            twChartInstance = new Chart(ctxTw, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: 'T_w (°C)', data: twData, borderColor: '#ff5722', fill: false }]
                },
                options: { scales: { x: { reverse: true } } }
            });

            qChartInstance = new Chart(ctxQ, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'q̇ (MW/ม²)', borderColor: '#facc15', data: qData },
                        { label: 'Mach', borderColor: '#00bcd4', data: machData }
                    ]
                },
                options: { scales: { x: { reverse: true } } }
            });
        }
    </script>
</body>
    </html>
